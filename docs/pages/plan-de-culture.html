<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maraîchage Planificateur V3 - Les Jardins du Cœur</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .c-editor-frame { display: grid; grid-template-columns: 1fr 320px; gap: 24px; height: calc(100vh - 160px); }
        #canvas-app { width: 100%; height: 100%; border-radius: 12px; position: relative; background: #87CEEB; overflow: hidden; }
        
        /* Toolbars */
        .c-floating-tools { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .c-view-nav { position: absolute; bottom: 15px; right: 15px; z-index: 10; display: flex; gap: 5px; background: white; padding: 5px; border-radius: 20px; box-shadow: var(--shadow-soft); }
        
        .c-legend-panel { background: white; padding: 20px; border-radius: 12px; box-shadow: var(--shadow-soft); overflow-y: auto; }
        .c-active-tool-display { background: var(--color-primary); color: white; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        
        .c-tool-item { 
            display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid #eee; 
            border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: 0.2s;
        }
        .c-tool-item:hover { border-color: var(--color-secondary); }
        .c-tool-item.is-selected { background: #f0f7f0; border: 2px solid var(--color-primary); }

        .c-btn-tool-sm { border: none; background: none; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .c-btn-tool-sm.active { background: var(--color-secondary); color: white; }

        @media (max-width: 768px) { .c-editor-frame { grid-template-columns: 1fr; } #canvas-app { height: 400px; } }
    </style>
</head>
<body class="l-app-layout">
    <aside class="c-sidebar">
        <div class="c-sidebar__header"><span class="material-icons">eco</span> Jardins du Cœur</div>
        <nav class="c-sidebar__nav">
            <ul class="c-nav-list">
                <li class="c-nav-item"><a href="dashboard.html" class="c-nav-link"><span class="material-icons">dashboard</span> Home</a></li>
                <li class="c-nav-item"><a href="plan-de-culture.html" class="c-nav-link c-nav-link--active"><span class="material-icons">view_in_ar</span> Plan 3D</a></li>
            </ul>
        </nav>
    </aside>

    <main class="l-main-content">
        <header class="c-topbar">
            <h2>Éditeur Maraîcher (250m²)</h2>
            <div class="c-tool-group">
                <input type="file" id="import-json" style="display:none" onchange="GardenData.importJSON(event)">
                <button class="c-btn-action" style="background:#6c757d" onclick="document.getElementById('import-json').click()">📂 Importer</button>
                <button class="c-btn-action" onclick="GardenData.exportJSON()">💾 Exporter</button>
            </div>
        </header>

        <section class="l-page-content c-editor-frame">
            <div id="canvas-app">
                <div class="c-view-nav">
                    <button class="c-btn-tool-sm active" id="view-3d" onclick="GardenEngine.setView('3d')">3D</button>
                    <button class="c-btn-tool-sm" id="view-2d" onclick="GardenEngine.setView('2d')">2D Plan</button>
                </div>
            </div>

            <aside class="c-legend-panel">
                <div class="c-active-tool-display">
                    <small>Outil sélectionné :</small>
                    <div id="tool-label">SÉLECTION</div>
                </div>
                
                <div id="legend-list">
                    </div>

                <div id="parcel-info" style="margin-top:20px; font-size:0.9rem; border-top:1px solid #eee; padding-top:15px;">
                    <p><strong>Ligne :</strong> <span id="ui-id">---</span></p>
                    <p><strong>Culture :</strong> <span id="ui-content">---</span></p>
                </div>
            </aside>
        </section>
    </main>
<footer class="c-mobile-nav">
    <a href="dashboard.html" class="c-mobile-nav__item">
        <span class="material-icons">dashboard</span>
        <span>Home</span>
    </a>
    <a href="plan-de-culture.html" class="c-mobile-nav__item">
        <span class="material-icons">view_in_ar</span>
        <span>Plan 3D</span>
    </a>
    <a href="fiche-plante.html" class="c-mobile-nav__item">
        <span class="material-icons">local_florist</span>
        <span>Suivi</span>
    </a>
    <a href="atelier.html" class="c-mobile-nav__item">
        <span class="material-icons">handyman</span>
        <span>Ateliers</span>
    </a>
    <a href="galery.html" class="c-mobile-nav__item">
        <span class="material-icons">photo_library</span>
        <span>Galerie</span>
    </a>
</footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script src="../js/garden-data.js"></script>
    <script src="../js/garden-engine.js"></script>
    <script src="../js/garden-ui.js"></script>
</body>
</html>
